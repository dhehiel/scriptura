name: Bug report
about: Report a defect in Scriptura code, schemas, or documentation.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you observed, with exact output where possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands run, in order. Include `make check` and `make test` output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity screening
      options:
        - label: This report contains no fabricated citations, identifiers, or licence claims.
